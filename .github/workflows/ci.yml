name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build and size (x86-64, informational until the MIPS build joins CI)
        run: |
          cargo build --release -p enkrnettd
          ls -l target/release/enkrnettd
          size target/release/enkrnettd || true

  ui:
    name: UI word check, types, unit tests, build, size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run wordcheck
      - run: npm run check
      - run: npm test
      - name: Build with the size check (ENK-FOOT-002)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  browser:
    name: Browser harness (Chromium and WebKit at phone size)
    runs-on: ubuntu-latest
    needs: [ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build the daemon
        run: cargo build -p enkrnettd
      - name: Install the harness and the browsers
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run the harness
        working-directory: tests/browser
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/browser/test-results

  mips:
    name: MIPS build, budgets, OpenWrt package
    runs-on: ubuntu-latest
    needs: [ui]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools zstd xz-utils file
      - name: Pinned nightly with rust-src
        run: |
          NIGHTLY=$(python3 -c "import json; print(json.load(open('openwrt/lock/inputs.json'))['rust']['nightly'])")
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: mips
      - name: Cache the OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: openwrt/.cache
          key: openwrt-sdk-${{ hashFiles('openwrt/lock/inputs.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build, measure (ENK-FOOT-001 to 003), package
        run: openwrt/build-mips.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: enkrnett-mipsel_24kc
          path: |
            openwrt/out/enkrnettd
            openwrt/out/sizes.json
            openwrt/out/*.apk

  book:
    name: mdBook builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: cd docs && mdbook build
