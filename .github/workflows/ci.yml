name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Requirement-to-test traceability (chapter 14 rule 1)
        run: python3 tests/traceability.py --release 0.1.0 && python3 tests/traceability.py --release 0.2.0
      - name: Release build and size (x86-64, informational until the MIPS build joins CI)
        run: |
          cargo build --release -p enkrnettd
          ls -l target/release/enkrnettd
          size target/release/enkrnettd || true

  ui:
    name: UI word check, types, unit tests, build, size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run wordcheck
      - run: npm run check
      - run: npm test
      - name: Build with the size check (ENK-FOOT-002)
        run: npm run build
      - name: Build again and compare (ENK-BUILD-009)
        run: |
          npx vite build --outDir dist-again --emptyOutDir >/dev/null
          diff -r dist dist-again && echo "UI bundle: the two builds are identical"
          rm -rf dist-again
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  browser:
    name: Browser harness (Chromium and WebKit at phone size)
    runs-on: ubuntu-latest
    needs: [ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build the daemon
        run: cargo build -p enkrnettd
      - name: Install the harness and the browsers
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run the harness
        working-directory: tests/browser
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/browser/test-results

  mips:
    name: MIPS build, budgets, OpenWrt package
    runs-on: ubuntu-latest
    needs: [ui]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools zstd xz-utils file
      - name: Pinned nightly with rust-src
        run: |
          NIGHTLY=$(python3 -c "import json; print(json.load(open('openwrt/lock/inputs.json'))['rust']['nightly'])")
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: mips
      - name: Cache the OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: openwrt/.cache
          key: openwrt-sdk-${{ hashFiles('openwrt/lock/inputs.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build twice and compare (ENK-BUILD-009), measure (ENK-FOOT-001 to 003), package
        run: openwrt/build-mips.sh --package --twice
      - uses: actions/upload-artifact@v4
        with:
          name: enkrnett-mipsel_24kc
          path: |
            openwrt/out/enkrnettd
            openwrt/out/sizes.json
            openwrt/out/*.apk

  images:
    name: Images from the lock, built twice and compared; the release directory
    runs-on: ubuntu-latest
    needs: [mips]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd xz-utils python3 patch
      - name: Cache the Image Builders and the mirror of the locked packages
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.cache/ib
            openwrt/.cache/mirror
          key: openwrt-images-${{ hashFiles('openwrt/lock/**') }}
      - uses: actions/download-artifact@v4
        with:
          name: enkrnett-mipsel_24kc
          path: openwrt/out
      - name: Every Tier 1 profile from the lock, twice (ENK-BUILD-007, 008, 010; ENK-RLS-002)
        run: |
          APK=$(ls openwrt/out/enkrnett-*.apk | head -1)
          for p in elecom_wrc-1167gst2 buffalo_wcr-1166ds; do
            openwrt/build-image.sh "$p" --apk "$APK" --twice
          done
      - name: The release directory (ENK-BUILD-012; unsigned, the key is never here)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          openwrt/release-assemble.sh "$VERSION"
          cat "openwrt/out/release/$VERSION/build-report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: enkrnett-release-unsigned
          path: openwrt/out/release

  book:
    name: mdBook builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: cd docs && mdbook build
